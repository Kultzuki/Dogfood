services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@db:5432/dogfood
      # ── SESSION_SECRET ────────────────────────────────────────────────
      # The default below is a DETERMINISTIC LOCAL-SANDBOX VALUE, not a real
      # secret. It is pinned so that the committed acceptance config
      # (.dogfood.toml) keeps verifying its fixed `sid` tokens across a
      # `docker compose down -v` reset — without it, the official checker
      # scores 5/7 on a fresh boot because every volume gets a new random
      # secret.
      #
      # ⚠️  OVERRIDE THIS FOR ANY REAL DEPLOYMENT. With this default left in
      # place, anyone who can read this repository can forge a session cookie
      # for the public fixture tokens and act as the fixture organizer/judges.
      # Generate your own with `openssl rand -hex 32` and export it, e.g.
      #   SESSION_SECRET=$(openssl rand -hex 32) docker compose up -d
      # Omit the value entirely to fall back to first-boot auto-generation
      # (stored in the appdata volume) — but then .dogfood.toml will not work.
      SESSION_SECRET: "${SESSION_SECRET:-dogfood-local-demo-session-secret-0000000000}"
      NODE_ENV: production
      # ── LOCAL DEMO ONLY ────────────────────────────────────────────
      # Seeds four fixed password accounts (test.organizer / test.judgea /
      # test.judgeb / test.participant @dogfood.local, shared password) so a
      # human can drive the browser UI locally. They are NOT the acceptance
      # fixture identities and .dogfood.toml never references them.
      # SET THIS TO 0 (or add `DOGFOOD_DEMO_ACCOUNTS=0` to a .env file next to
      # this file) FOR ANY DEPLOYMENT THAT IS NOT A LOCAL SANDBOX — and set
      # your own SESSION_SECRET at the same time.
      DOGFOOD_DEMO_ACCOUNTS: "${DOGFOOD_DEMO_ACCOUNTS:-1}"
    volumes:
      - appdata:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
