# .dogfood.toml — acceptance checker config (see stuff/spec.md).
# Run (sandbox-reproducible):
#   SESSION_SECRET=dogfood-local-demo-session-secret-0000000000 DOGFOOD_DEMO_ACCOUNTS=0 docker compose up --build -d
#   py -3 stuff/run.py .dogfood.toml --fixtures stuff/fixtures.json > acceptance-report.txt
# The deterministic SESSION_SECRET above is a throwaway sandbox-only opt-in
# so these cookies verify across `down -v` resets; never use it outside a
# local sandbox. With a normal boot (no SESSION_SECRET), re-copy the
# `Cookie: sid=...` lines the container prints at boot.
#
# Reproducibility contract for the [auth] block below: these cookies are
# HMAC-signed with the SESSION_SECRET pinned in compose.yaml, so they stay
# valid across `docker compose down -v` resets. If you override
# SESSION_SECRET in your own environment, re-copy the `Cookie: sid=...`
# lines the container prints at boot.

[portal]
base_url = "http://localhost:3000"

[tiers]
claimed = ["T1", "T2"]
pitch = "Self-hostable hackathon submission and judging platform with backend-enforced role isolation."

[auth]
organizer = "Cookie: sid=fixture-organizer.8Q-odhJpG_6OcIwk6or3KVJOvO61ckyML8nMO7ncBXY"
judge_a = "Cookie: sid=fixture-judge-a.NyByZmSl_R3OaC0ixjmsXccqDOzqeXgzYuldFLTqS2o"
judge_b = "Cookie: sid=fixture-judge-b.QzQuhWBrwPXVhlzsuoIrcZjkEw37mGsb8kFaHfBC_hg"
participant = "Cookie: sid=fixture-participant.zttHoYNcpjFF9ydPajLFCwrJpI_RCWPY6dMYSj9ITow"

[routes]
gallery = "/gallery"
submit = "/projects/new"
judge_scores = "/api/judge/scores"
# judge_a is the first fixture judge that has scores: tomas.varga@example.org
# (deterministic from stuff/fixtures.json). A user UUID would NOT work here —
# fresh seeds regenerate it with gen_random_uuid().
peer_scores = "/api/judge/scores?judge=tomas.varga@example.org"
csv_export = "/api/export.csv"
